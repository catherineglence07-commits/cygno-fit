<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygno Fit</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #e6f2ff, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Fitness Background Animation */
body::before {
    content: "🏃‍♂️ 💪 🥗 🏋️‍♀️";
    position: absolute;
    font-size: 40px;
    opacity: 0.08;
    animation: float 20s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-100vh) rotate(360deg); }
}

.container {
    background: #ffffff;
    padding: 35px;
    width: 95%;
    max-width: 500px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    position: relative;
    z-index: 2;
}

h1 {
    text-align: center;
    color: #2b7cff;
    margin-bottom: 25px;
}

.question {
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
}

select, input[type="text"] {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #cce0ff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
}

select:focus, input[type="text"]:focus {
    border-color: #2b7cff;
    box-shadow: 0 0 5px rgba(43,124,255,0.3);
}

#otherCondition {
    display: none;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #2b7cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.3s;
}

button:hover {
    background: #1f5fd4;
    transform: translateY(-2px);
}

@media (max-width: 500px) {
    .container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Cygno Fit</h1>

    <form id="nutritionForm">

        <!-- Goal -->
        <div class="question">
            <label>1. What is your Goal?</label>
            <select required>
                <option value="">Select your goal</option>
                <option>Lose weight</option>
                <option>Gain weight</option>
                <option>Maintain weight</option>
            </select>
        </div>

        <!-- Activity Level -->
        <div class="question">
            <label>2. What is your activity level?</label>
            <select required>
                <option value="">Select activity level</option>
                <option>Sedentary (little or no exercise)</option>
                <option>Lightly active</option>
                <option>Moderately active</option>
                <option>Very active</option>
            </select>
        </div>

        <!-- Diet -->
        <div class="question">
            <label>3. Do you follow any specific diet?</label>
            <select required>
                <option value="">Select diet type</option>
                <option>Vegetarian</option>
                <option>Vegan</option>
                <option>Non-vegetarian</option>
                <option>Keto</option>
                <option>No preference</option>
            </select>
        </div>

        <!-- Medical Condition -->
        <div class="question">
            <label>4. Do you have any medical conditions?</label>
            <select id="medicalCondition" required>
                <option value="">Select option</option>
                <option>Diabetes</option>
                <option>PCOS</option>
                <option>Thyroid</option>
                <option>None</option>
                <option value="Other">Other</option>
            </select>

            <input type="text" id="otherCondition" placeholder="Please specify your condition">
        </div>

        <!-- Motivation -->
        <div class="question">
            <label>5. What motivates you to track calories?</label>
            <select required>
                <option value="">Select motivation</option>
                <option>Improve appearance</option>
                <option>Improve health</option>
                <option>Doctor recommendation</option>
                <option>Sports performance</option>
                <option>Just curiosity</option>
            </select>
        </div>

        <button type="submit">Next</button>

    </form>
</div>

<script>
const medicalSelect = document.getElementById("medicalCondition");
const otherInput = document.getElementById("otherCondition");

medicalSelect.addEventListener("change", function() {
    if (this.value === "Other") {
        otherInput.style.display = "block";
        otherInput.required = true;
    } else {
        otherInput.style.display = "none";
        otherInput.required = false;
    }
});

document.getElementById("nutritionForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Form submitted successfully!");
});
</script>

</body>
</html>
