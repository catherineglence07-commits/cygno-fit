<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygno Fit</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e6f7ff, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 600px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    animation: fadeIn 1s ease-in-out;
}

h1 {
    text-align: center;
    color: #00aaff;
    margin-bottom: 5px;
}

.fitness-animation {
    text-align: center;
    font-size: 40px;
    animation: bounce 1.5s infinite;
    margin-bottom: 15px;
}

.question {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

select, input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    background: #00aaff;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #008ecc;
}

.hidden {
    display: none;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(20px);}
    to {opacity:1; transform: translateY(0);}
}

@keyframes bounce {
    0%,100% {transform: translateY(0);}
    50% {transform: translateY(-8px);}
}
</style>
</head>

<body>

<div class="container">

    <h1>Cygno Fit</h1>
    <div class="fitness-animation">💪🏃‍♂️</div>

    <form id="fitnessForm">

        <div class="question">
            <label>What is your primary goal?</label>
            <select required>
                <option value="">Select an option</option>
                <option>Lose weight</option>
                <option>Gain weight</option>
                <option>Maintain weight</option>
                <option>Build muscle</option>
            </select>
        </div>

        <div class="question">
            <label>What is your activity level?</label>
            <select required>
                <option value="">Select an option</option>
                <option>Sedentary</option>
                <option>Lightly active</option>
                <option>Moderately active</option>
                <option>Very active</option>
            </select>
        </div>

        <div class="question">
            <label>Do you follow any specific diet?</label>
            <select required>
                <option value="">Select an option</option>
                <option>Vegetarian</option>
                <option>Vegan</option>
                <option>Non-vegetarian</option>
                <option>Keto</option>
                <option>No preference</option>
            </select>
        </div>

        <div class="question">
            <label>Do you have any medical conditions?</label>
            <select id="medicalSelect" required>
                <option value="">Select an option</option>
                <option>Diabetes</option>
                <option>PCOS</option>
                <option>Thyroid</option>
                <option>None</option>
                <option value="Other">Other</option>
            </select>

            <input type="text" id="otherInput" class="hidden"
                   placeholder="Enter your medical condition">
        </div>

        <div class="question">
            <label>What motivates you to track calories?</label>
            <select required>
                <option value="">Select an option</option>
                <option>Improve appearance</option>
                <option>Improve health</option>
                <option>Doctor recommendation</option>
                <option>Sports performance</option>
                <option>Just curiosity</option>
            </select>
        </div>

        <button type="submit">Next ➜</button>

    </form>
</div>

<script>
const medicalSelect = document.getElementById("medicalSelect");
const otherInput = document.getElementById("otherInput");

medicalSelect.addEventListener("change", function() {
    if (this.value === "Other") {
        otherInput.classList.remove("hidden");
        otherInput.required = true;
    } else {
        otherInput.classList.add("hidden");
        otherInput.required = false;
        otherInput.value = "";
    }
});

document.getElementById("fitnessForm").addEventListener("submit", function(e) {
    e.preventDefault();
    if (this.checkValidity()) {
        alert("Form Submitted Successfully 🚀");
    }
});
</script>

</body>
</html>
